<title>Dealbot Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: identity bar, one row of tiles led by the equity figure, a band with the equity curve and the funnel,
   the moves feed with its filters, then calibration, trials and the bench. Everything is scanned, not read. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --wash: rgba(11, 11, 11, 0.04);
  --s1: #2a78d6; --s1-wash: rgba(42, 120, 214, 0.10); --s1-ink: #1c5cab;
  --good: #0ca30c; --good-text: #006300; --warning: #fab219; --warning-text: #7a5200; --serious: #ec835a; --critical: #d03b3b; --critical-text: #a52a2a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
  --s1: #3987e5; --s1-wash: rgba(57, 135, 229, 0.14); --s1-ink: #86b6ef;
  --good-text: #0ca30c; --warning-text: #fab219; --critical-text: #e66767; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
  --s1: #3987e5; --s1-wash: rgba(57, 135, 229, 0.14); --s1-ink: #86b6ef;
  --good-text: #0ca30c; --warning-text: #fab219; --critical-text: #e66767; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.04em; }
.sub { color: var(--muted); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.topbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink2); background: var(--surface); }
.pill b { color: var(--ink); font-weight: 600; }
.pill.mode-paper b { color: var(--s1-ink); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.good { background: var(--good); } .dot.warning { background: var(--warning); } .dot.critical { background: var(--critical); } .dot.info { background: var(--s1); }
.banner { margin-top: 12px; border-left: 4px solid var(--critical); background: var(--surface); padding: 10px 12px; border-radius: 0 6px 6px 0; }
.banner b { color: var(--critical-text); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .label { font-size: 12px; color: var(--ink2); }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hero .value { font-size: clamp(24px, 2.4vw, 30px); letter-spacing: -0.01em; }
.more { margin-top: 10px; }
.tile .delta { font-size: 12px; margin-top: 2px; color: var(--ink2); }
.up { color: var(--good-text); } .down { color: var(--critical-text); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 16px; }
.filters .group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters .group > span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chip:focus-visible, .row:focus-visible, select:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
.band { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
.band3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 760px) { .band { grid-template-columns: minmax(0, 1fr); } }
figure, .panel { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; position: relative; }
figure header, .panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--muted); font-size: 11px; }
.grid line { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.series { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { fill: var(--s1-wash); }
.mark { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.mark.hover { fill: var(--s1); }
.crosshair { stroke: var(--axis); stroke-width: 1; }
.label { fill: var(--ink); font-size: 12px; font-weight: 600; }
.label2 { fill: var(--ink2); font-size: 11px; }
.ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
.bar { fill: var(--s1); }
.bar.ghost { fill: var(--wash); }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); color: var(--ink2); white-space: nowrap; }
.tooltip b { color: var(--ink); font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.r, th.r { text-align: right; }
.row { cursor: pointer; }
.row:hover { background: var(--wash); }
.row.open { background: var(--s1-wash); }
.kind { font-size: 11px; color: var(--ink2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: var(--ink2); }
.detail td { background: var(--page); padding: 12px 10px 14px; }
.detail .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.detail h3 { font-size: 12px; margin: 0 0 6px; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.04em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.q { margin-bottom: 8px; }
.q .text { font-size: 12px; color: var(--ink2); }
.pbar { display: grid; grid-template-columns: minmax(60px, 110px) 1fr 44px; align-items: center; gap: 6px; font-size: 12px; }
.pbar .track { height: 8px; background: var(--wash); border-radius: 4px; position: relative; overflow: hidden; }
.pbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.pbar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.pbar .chosen { font-weight: 600; color: var(--ink); }
.scroll { overflow-x: auto; }
.list { margin: 0; padding-left: 18px; font-size: 13px; }
.muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>

<div class="topbar">
  <h1>Dealbot desk</h1>
  <span class="pill" id="pill-mode"><span>mode</span><b>…</b></span>
  <span class="pill" id="pill-bot"><span>bot</span><b>…</b></span>
  <span class="pill" id="pill-trial"><span>trial</span><b class="mono">…</b></span>
  <span class="pill" id="pill-model"><span>Jev</span><b>…</b></span>
  <span class="spacer"></span>
  <span class="live" id="live"><span class="dot"></span><span>connecting</span></span>
</div>
<div class="banner" id="banner" hidden><b>Desk fault</b> <span id="banner-text"></span></div>

<section class="tiles" id="tiles"></section>

<section class="filters" aria-label="Filters">
  <div class="group"><span>Range</span>
    <button class="chip" data-range="all" aria-pressed="true">All</button>
    <button class="chip" data-range="86400000" aria-pressed="false">24h</button>
    <button class="chip" data-range="21600000" aria-pressed="false">6h</button>
    <button class="chip" data-range="3600000" aria-pressed="false">1h</button>
    <button class="chip" data-range="900000" aria-pressed="false">15m</button>
  </div>
  <div class="group"><span>Show</span>
    <button class="chip" data-show="decision" aria-pressed="true">Decisions</button>
    <button class="chip" data-show="trade" aria-pressed="true">Trades</button>
    <button class="chip" data-show="veto" aria-pressed="true">Vetoes</button>
    <button class="chip" data-show="rejection" aria-pressed="false">Funnel rejections</button>
    <button class="chip" data-show="system" aria-pressed="true">System</button>
  </div>
  <div class="group"><span>Symbol</span><select id="sym-filter"><option value="">all</option></select></div>
</section>

<section class="band">
  <figure id="equity-fig">
    <header><h2>Equity</h2><span class="sub" id="equity-sub"></span></header>
    <div id="equity-chart"></div>
    <figcaption>Paper equity after fees and gas, sampled every heartbeat. Hover for the value at a block.</figcaption>
  </figure>
  <figure id="funnel-fig">
    <header><h2>Funnel</h2><span class="sub">rejections since start</span></header>
    <div id="funnel-chart"></div>
    <div id="funnel-checks" class="note"></div>
  </figure>
</section>

<section class="panel" style="margin-top:12px">
  <header><h2>Moves</h2><span class="sub" id="moves-sub"></span></header>
  <div class="scroll"><table id="moves"><thead><tr><th>Time (UTC)</th><th class="r">Block</th><th>Kind</th><th>Symbol</th><th>Move</th><th>Status</th></tr></thead><tbody></tbody></table></div>
  <button class="chip more" id="moves-more" hidden>Show more</button>
</section>

<section class="band3">
  <figure id="cal-fig">
    <header><h2>Calibration</h2><span class="sub" id="cal-sub"></span></header>
    <div id="cal-chart"></div>
    <figcaption>Observed frequency against predicted probability, one dot per bucket, sized by count. The dashed line is perfect calibration.</figcaption>
  </figure>
  <div class="panel" id="trials-panel">
    <header><h2>Trials</h2><span class="sub" id="trials-sub"></span></header>
    <div class="scroll"><table id="trials"><thead><tr><th>Trial</th><th>Bot</th><th class="r">Runs</th><th class="r">Obs</th><th class="r">Sharpe</th><th class="r">Best noise</th><th class="r">DSR</th><th>Verdict</th></tr></thead><tbody></tbody></table></div>
    <div class="note" id="trials-note"></div>
  </div>
  <div class="panel" id="bench-panel">
    <header><h2>Bench</h2><span class="sub" id="bench-sub"></span></header>
    <div id="bench"></div>
    <header style="margin-top:14px"><h2>Judge</h2></header>
    <div id="judge" class="kv"></div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const S = { data: null, details: {}, mode: 'live', range: 'all', show: { decision: true, trade: true, veto: true, rejection: false, system: true }, sym: '', expanded: null, lastFetch: 0, failed: false, limit: 120 };
  const PAGE = 120;
  const TRADE = new Set(['fill', 'order', 'would_execute', 'position_opened', 'position_closed', 'order_expired']);
  const SYSTEM = new Set(['trial', 'error']);
  const STAGES = ['free_cut', 'one_call', 'hard_facts', 'jev', 'final_pick'];
  const $ = (sel) => document.querySelector(sel);

  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const c of children.flat()) { if (c === null || c === undefined) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return n;
  }
  function svg(tag, attrs, ...children) {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === 'text') n.textContent = v; else n.setAttribute(k, v); }
    for (const c of children.flat()) if (c) n.append(c);
    return n;
  }
  const fmtUsd = (v) => v === null || v === undefined ? '–' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(v);
  const fmtSigned = (v, d) => v === null || v === undefined ? '–' : (v > 0 ? '+' : '') + Number(v).toFixed(d === undefined ? 2 : d);
  const fmtCompact = (v, step) => (step === undefined ? Math.abs(v) >= 1000 : step >= 1000) && Math.abs(v) >= 1000 ? '$' + (v / 1000).toFixed(step !== undefined && step >= 10000 ? 0 : 1) + 'K' : '$' + Math.round(v).toLocaleString('en-US');
  const fmtTime = (ts) => ts ? new Date(ts).toISOString().slice(11, 19) : '–';
  const fmtStamp = (ts) => ts ? new Date(ts).toISOString().replace('T', ' ').slice(0, 19) + 'Z' : '–';
  const ago = (ms) => ms < 1000 ? 'just now' : ms < 60000 ? Math.round(ms / 1000) + 's ago' : ms < 3600000 ? Math.round(ms / 60000) + 'm ago' : Math.round(ms / 3600000) + 'h ago';
  const num = (v, d) => v === null || v === undefined ? '–' : Number(v).toFixed(d === undefined ? 2 : d);

  async function load() {
    let data = null;
    try {
      const r = await fetch('./api/state', { cache: 'no-store' });
      if (!r.ok) throw new Error('no api');
      data = await r.json(); S.mode = 'live';
    } catch (e) {
      try {
        const r = await fetch('./data.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('no snapshot');
        data = await r.json(); S.mode = 'snapshot'; S.details = data.details || {};
      } catch (e2) { S.failed = true; renderLive(); return; }
    }
    S.failed = false; S.data = data; S.lastFetch = Date.now();
    render();
  }

  function latestTs() {
    const d = S.data; let t = d.summary.last_event_ms || 0;
    for (const m of d.moves) if (m.ts && m.ts > t) t = m.ts;
    return t;
  }
  function cutoff() { return S.range === 'all' ? -Infinity : latestTs() - Number(S.range); }

  function render() {
    renderLive(); renderHeader(); renderTiles(); renderSymbols(); renderEquity(); renderFunnel(); renderMoves(); renderCalibration(); renderTrials(); renderBenchJudge();
  }

  function renderLive() {
    const live = $('#live'); live.replaceChildren();
    if (S.failed) { live.append(el('span', { class: 'dot critical' }), el('span', { text: 'no data: start the desk and run python -m dashboard.serve' })); return; }
    if (!S.data) return;
    const s = S.data.summary;
    if (S.mode === 'snapshot') {
      live.append(el('span', { class: 'dot info' }), el('span', { text: 'snapshot exported ' + fmtStamp(S.data.source && S.data.source.exported_ms) }));
    } else {
      const stale = s.last_event_ms ? Date.now() - s.last_event_ms : null;
      const cls = stale !== null && stale < 120000 ? 'good' : 'warning';
      live.append(el('span', { class: 'dot ' + cls }), el('span', { text: 'live, refreshed ' + ago(Date.now() - S.lastFetch) + (s.block_ts ? ', last block ' + fmtTime(s.block_ts) + 'Z' : '') }));
    }
  }

  function setPill(id, value, cls) { const p = $(id); p.querySelector('b').textContent = value || '–'; if (cls) p.className = 'pill ' + cls; }
  function renderHeader() {
    const s = S.data.summary;
    setPill('#pill-mode', s.mode ? s.mode.toUpperCase() : null, s.mode === 'paper' ? 'mode-paper' : '');
    setPill('#pill-bot', s.bot); setPill('#pill-trial', s.trial_id ? s.trial_id.slice(0, 8) : null); setPill('#pill-model', s.model);
    const banner = $('#banner'); banner.hidden = !s.fault; $('#banner-text').textContent = s.fault || '';
  }

  function tile(label, value, delta, opts) {
    const t = el('div', { class: 'tile' + (opts && opts.hero ? ' hero' : '') }, el('div', { class: 'label', text: label }), el('div', { class: 'value' + (opts && opts.num ? ' num' : ''), text: value }));
    if (delta) t.append(delta);
    return t;
  }
  function renderTiles() {
    const s = S.data.summary, c = s.counts || {};
    const tiles = $('#tiles'); tiles.replaceChildren();
    const pnl = s.day_pnl_usd, eq = s.equity_usd;
    const bps = eq && pnl !== null && pnl !== undefined && eq - pnl > 0 ? (pnl / (eq - pnl)) * 1e4 : null;
    const dir = pnl > 0 ? 'up' : pnl < 0 ? 'down' : '';
    tiles.append(tile('Equity', fmtUsd(eq), el('div', { class: 'delta ' + dir, text: pnl === null || pnl === undefined ? 'no mark yet' : (pnl > 0 ? '▲ ' : pnl < 0 ? '▼ ' : '') + fmtSigned(pnl) + ' USD today' + (bps !== null ? ' (' + fmtSigned(bps, 0) + ' bps)' : '') }), { hero: true }));
    const p = s.position;
    tiles.append(tile('Position', p ? p.side + ' ' + Math.abs(p.qty) + ' ' + p.sym : 'flat', el('div', { class: 'delta', text: p ? 'entry ' + num(p.entry_price, 2) + (s.block !== null && p.entry_block !== undefined ? ', ' + (s.block - p.entry_block) + ' blocks' : '') : (s.pending_order ? 'entry order resting' : 'scanning') })));
    tiles.append(tile('Block', s.block === null || s.block === undefined ? '–' : '#' + s.block, el('div', { class: 'delta', text: s.block_ts ? fmtStamp(s.block_ts) : '' }), { num: true }));
    tiles.append(tile('Decisions', String(c.decisions || 0), el('div', { class: 'delta', text: 'executed ' + (c.executed || 0) + ', vetoed ' + (c.vetoed || 0) + ', hold ' + (c.holds || 0) + (c.shadow_approved ? ', shadow ' + c.shadow_approved : '') }), { num: true }));
    const realized = (s.realized_pnl_usd || 0) - (s.fees_usd || 0);
    tiles.append(tile('Trades', String(c.fills || 0) + ' fills', el('div', { class: 'delta ' + (realized > 0 ? 'up' : realized < 0 ? 'down' : ''), text: 'realized after fees ' + fmtSigned(realized) + ' USD' }), { num: true }));
    const topVeto = Object.keys(S.data.vetoes_by_check || {})[0];
    tiles.append(tile('Vetoes fired', String(c.vetoes || 0), el('div', { class: 'delta', text: topVeto ? 'most often: ' + topVeto : 'none so far' }), { num: true }));
    const j = S.data.judge || {};
    tiles.append(tile('Judge calls', String(j.calls || 0), el('div', { class: 'delta', text: (s.judge_latency_ms_mean !== null && s.judge_latency_ms_mean !== undefined ? 'mean ' + s.judge_latency_ms_mean + ' ms' : 'no calls') + (j.timeouts ? ', ' + j.timeouts + ' timeouts' : '') + (j.rate_limited ? ', ' + j.rate_limited + ' rate limited' : '') }), { num: true }));
  }

  function renderSymbols() {
    const sel = $('#sym-filter'); const syms = new Set();
    for (const m of S.data.moves) if (m.sym) syms.add(m.sym);
    for (const r of S.data.rejections) if (r.sym) syms.add(r.sym);
    const current = sel.value;
    sel.replaceChildren(el('option', { value: '', text: 'all' }), ...[...syms].sort().map((s) => el('option', { value: s, text: s })));
    sel.value = [...syms].includes(current) ? current : '';
    S.sym = sel.value;
  }

  function niceTicks(lo, hi, n) {
    if (!(hi > lo)) { const v = lo || 0; return [v]; }
    const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  }

  function renderEquity() {
    const host = $('#equity-chart'); host.replaceChildren();
    const co = cutoff(); const pts = S.data.equity.filter((p) => p.equity !== null && (p.ts || 0) >= co);
    $('#equity-sub').textContent = pts.length ? pts.length + ' samples, ' + fmtTime(pts[0].ts) + ' to ' + fmtTime(pts[pts.length - 1].ts) + 'Z' : '';
    if (pts.length < 2) { host.append(el('div', { class: 'empty', text: 'Fewer than two equity samples in this range.' })); return; }
    const W = Math.max(320, host.getBoundingClientRect().width || 600), H = 240, m = { l: 58, r: 76, t: 14, b: 26 };
    const xs = pts.map((p) => p.ts), ys = pts.map((p) => p.equity);
