name: dealbot

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub cron is best-effort; runs may lag a few minutes
  workflow_dispatch:

concurrency:
  group: dealbot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Persist the SQLite state between runs so you aren't re-alerted.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/dealbot.db
          key: dealbot-db-${{ github.run_id }}
          restore-keys: dealbot-db-

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -m dealbot -c config.example.yaml run

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/dealbot.db
          key: dealbot-db-${{ github.run_id }}
