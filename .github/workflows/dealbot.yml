name: dealbot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub cron is best-effort; expect a few minutes of lag
  workflow_dispatch:

concurrency:
  group: dealbot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography

      # Persist the SQLite state between runs so you aren't re-alerted.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/dealbot.db
          key: dealbot-db-${{ github.run_id }}
          restore-keys: dealbot-db-

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          WALMART_PRIVATE_KEY_PEM: ${{ secrets.WALMART_PRIVATE_KEY_PEM }}
          WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -m dealbot run

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/dealbot.db
          key: dealbot-db-${{ github.run_id }}
